<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f0e6" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  {% unless page.class == 'home' %}<header class="site-header">
    <a class="wordmark" href="/">{{ site.title }}</a>
  </header>{% endunless %}
  <main class="{{ page.class | default: 'page' }}">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>© {{ site.time | date: '%Y' }} {{ site.title }}</p>
  </footer>
</body>
</html>
